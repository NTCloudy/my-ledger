name: prices
on:
  schedule:
    - cron: "40 7,11 * * 1-5"   # 15:40 / 19:40 Taiwan time on weekdays
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_prices.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/prices.json
          git diff --cached --quiet || (git commit -m "prices $(date -u +%F)" && git push)
